name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  # The ledgers describe two other repos, so they can go stale without anything
  # happening here. A nightly run is what catches that.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  decision-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -I scripts/decision_records.py check
      - name: Changes of the pull request
        if: github.event_name == 'pull_request'
        run: python3 -I scripts/decision_records.py diff --base HEAD^1 --head HEAD
      - name: Changes of the push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 -I scripts/decision_records.py diff --base "$BEFORE" --head "$GITHUB_SHA"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .

      # The ledgers are written against specific branches, not whatever each repo
      # happens to call its default. parity.toml names the branch for each repo, so
      # a change of a repo's default branch does not change what is compared.
      - id: refs
        run: parity refs --format shell >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: CompMetEng/RAVEN
          ref: ${{ steps.refs.outputs.raven_matlab_ref }}
          path: repos/RAVEN
      - uses: actions/checkout@v7
        with:
          repository: CompMetEng/raven-toolbox
          ref: ${{ steps.refs.outputs.raven_python_ref }}
          path: repos/raven-toolbox
      - uses: actions/checkout@v7
        with:
          repository: CompMetEng/GECKO
          ref: ${{ steps.refs.outputs.gecko_matlab_ref }}
          path: repos/GECKO
      - uses: actions/checkout@v7
        with:
          repository: CompMetEng/geckopy
          ref: ${{ steps.refs.outputs.gecko_python_ref }}
          path: repos/geckopy

      - name: Point parity at the checked-out repos
        run: |
          cat > parity.local.toml <<'EOF'
          [pairs.raven.matlab]
          path = "repos/RAVEN"
          [pairs.raven.python]
          path = "repos/raven-toolbox"
          [pairs.gecko.matlab]
          path = "repos/GECKO"
          [pairs.gecko.python]
          path = "repos/geckopy"
          EOF

      # Fails when a public function on either side has no ledger entry, when a row
      # names something that no longer exists, or when a row contradicts itself.
      # Add --strict once the unreviewed count reaches zero.
      - name: Check the ledgers
        run: parity check

      - name: Render the parity reports
        run: parity report -o build/

      - uses: actions/upload-artifact@v7
        with:
          name: parity-reports
          path: build/
