    status: parity
    scenarios:
      - ec_fseof_ectestgem
      - ec_analysis_ecyeastgem
      - ec_analysis_ecyeastgem911
    differs:
      - fseof.value.targets_ranked
    notes: >-
      Both sides classify a reaction as a target by the absolute Pearson correlation (corrThreshold, default 0.9) between its absolute flux and the enforced production flux, as RAVEN's FSEOF does, rank by slope times correlation, consider only reactions with a gene rule, drop the usage_prot_* reactions and keep the enforced production reaction. Both take the top level from the pFBA solution that maximises the target and fix the objective at 0.999999 of its optimum in the pFBA step (solveLP(model,1) in RAVEN), so the enforced levels are equal (1295.998704 at the top on ecTestGEM). ec_fseof passes equality=True, which fixes the target flux at each level as ecFSEOF does. Both list the reaction targets first and the transport targets after them, each group ranked by slope times correlation, with ties in model order; geckopy marks the second group in its `transport` column (on ecYeastGEM 9.1.1 the 32 transport targets are the last 32 of 363 rows on both sides). Not compared: MATLAB's per-gene essentiality column and its absolute slope, which ec_fseof does not return. ecTestGEM matches on every solver pair run (Gurobi/Gurobi, GLPK/GLPK, GLPK/scipy, Gurobi/scipy). On ecYeastGEM the target sets are equal with Gurobi on both sides (372 on the tutorial model, 363 on 9.1.1) and the ranked order differs in 27 and 10 positions, in runs of reactions whose scores tie (the identical reactions of one lipid pathway share a score to 1e-12) or whose flux the pFBA vertex fixes differently. The regression runs on a pFBA solution that is not unique, so the targets follow the solver: with GLPK on both sides the tutorial model gives 357 targets in geckopy and 358 in MATLAB (r_2455 is a target in MATLAB and not in geckopy) and 207 ranks differ, and 9.1.1 gives equal sets with 188 ranks differing; with GLPK in MATLAB and scipy in geckopy 380 against 358 targets (22 targets that MATLAB does not list) and 188 ranks differ on 9.1.1; with Gurobi in MATLAB and scipy in geckopy 380 against 372 (11 targets that MATLAB does not list and 3 that geckopy does not list: HiGHS carries flux of about 2e-3 through other reactions of the same lipid pathway than the Gurobi vertex does) and 11 ranks differ on 9.1.1 (ec_analysis_ecyeastgem, ec_analysis_ecyeastgem911).
  - matlab: ecFVA
    python: geckopy.ec_fva
    status: parity
    scenarios:
      - ec_fva_ectestgem
      - ec_model_edit_edge_cases_ectestgem
      - ec_fva_ecyeastgem
      - ec_fva_light_humangem
    differs:
      - fixed_cobra_tolerance.fva
    notes: >-
      Both sides read each canonical reaction's bound directly off its own group's solve (the "diagonal"): forward minus reverse variants from the one LP that jointly optimised them, always a value some feasible flux distribution attains (GECKO#466). Both strip _EXP_n and then _REV only at the end of an id, so a reaction named R_REVX or R_EXP_1X is ranged over (ec_model_edit_edge_cases_ectestgem, which differs for other functions). RAVEN's solveLP gives Gurobi tolerances of 1e-9 and cobrapy leaves them at 1e-6; with the Python model set to 1e-9, both sides agree on the ranges of all 4102 reactions of ecYeastGEM with growth free and with growth fixed (0 reactions differ at 1e-6), and with the cobrapy default 1944 of them differ by more than 1e-6 (2535 of the 8204 bounds, by up to 0.97 absolute and 17 percent relative; fixed_cobra_tolerance in ec_fva_ecyeastgem). With the scipy solver in geckopy and Gurobi in MATLAB, ec_fva_ecyeastgem agrees with growth free (0 of 8204 bounds differ) and differs for one bound with growth fixed (the minimum of r_2720: -173.615 with scipy, -173.3495 with Gurobi in geckopy and in MATLAB, 0.15 percent relative) and for 2257 of the 8204 bounds of the run at the cobrapy tolerance (2258 of 24612 bounds against geckopy on Gurobi, 1 in fixed and none in free). That is the accuracy of HiGHS on the ill-scaled LPs of ecYeastGEM and a limit of the scipy solver, not a parity statement; the Python part of that run took about 100 minutes. On the light Human-GEM ecModel (ec_fva_light_humangem) with growth bounded below at 99 percent of its optimum both sides solve every recorded LP and agree on every recorded value. With growth fixed by an equality the LP is borderline feasible: ecFVA returns NaN for 44 maxima and 164 minima of 300 sampled reactions and ec_fva for 6 and 6, because RAVEN's Gurobi presolve reports the LP infeasible depending on the numerics (not on the algorithm), and the minimum of MAR07157 is 2.45e-4 in MATLAB and, in the parallel ec_fva run, 0 in geckopy (2.45e-4 when the LP is solved on a fresh model), so the scenario does not use the equality. With growth fixed by an equality and the scipy solver in geckopy, HiGHS reports the status 'aborted' for one of the LPs after a 'numeric' warning and ec_fva raises cobra's OptimizationError within 171 seconds, so the ranges are not compared on scipy; the cause was not examined.
