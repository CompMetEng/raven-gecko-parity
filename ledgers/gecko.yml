    notes: >-
      The fitted sigma agrees on both sides: both scan the 0.01 grid by default (geckopy's fit_sigma with method='bisect' gives a continuous sigma instead), return the first sigma of the growth plateau for a target that growth cannot reach, and open the bounds of the objective reaction to [0, 1000] on the fitted model (sigma_fitter_edge_cases_ectestgem). A target that growth cannot reach gives the same sigma on every solver: sigmaFitter takes the first sigma whose growth is within 1e-9 (relative) of the best growth, as fit_sigma does, so the rounding noise on the plateau (with GLPK 49.999999999999986 at sigma 0.06 and 50 at sigma 1) does not move the result. MATLAB on Gurobi and GLPK and geckopy on Gurobi, GLPK and scipy all give sigma 0.06 and a pool bound of 120 (sigma_fitter_edge_cases_ectestgem).
