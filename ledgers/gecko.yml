  - matlab: relaxProteomicsGreedy
    python: geckopy.relax_proteomics_greedy
    status: parity
    scenarios:
      - flexibilize_edge_cases_ectestgem
    differs:
      - relax_empty_enzyme_set.value
      - relax_tied_enzymes.value
    notes: >-
      Relaxes a shadow-price-ranked constrained enzyme in a greedy loop until a target growth is reached, an alternative to flexibilize_enz_concs. Not exposed to getEnzymeBottlenecks' dual-degeneracy finding: this uses constrainEnzConcs to give the relaxed enzymes their own individual usage bounds, a genuinely binding, non-degenerate constraint, rather than relying on the shared, freely-interchangeable protein pool. An empty enzymeSet means all enzymes in MATLAB and none in geckopy (converged is false). geckopy relaxes the enzyme with the largest absolute shadow price and takes the lowest id among exact ties. Which enzyme has the largest price follows the dual solution of the LP, which is not unique when two enzymes bind: geckopy on Gurobi relaxes P5 (price -14.4) before P4 (-1.35) and MATLAB relaxes P4 first, while geckopy on the scipy solver relaxes P4 first, as MATLAB does. The final set and the growth are the same (flexibilize_edge_cases_ectestgem).
