  - matlab: getEnzymeBottlenecks
    python: geckopy.get_enzyme_bottlenecks
    status: parity
    scenarios:
      - enzyme_usage_edge_cases_ectestgem
      - ec_analysis_ecyeastgem
      - ec_analysis_ecyeastgem911
    differs:
      - bottlenecks.value
      - tied_bottlenecks.value
    notes: >-
      Per-enzyme dual-based bottleneck ranker: top-N enzymes by |shadow price| of their prot_<id> mass-balance constraint. An enzyme that carries zero flux at the optimum has a genuinely LP-dual-degenerate shadow price: which value comes back (an exact 0, or the shared protein pool's own nonzero dual propagated uniformly to it) depends on the solver build/platform/presolve path, not on the calling language, so it is not a stable MATLAB-vs-Python split. Only what is stable everywhere is compared: every primal-derived value (flux, capUsage, upperBound) and that results are sorted by non-increasing |shadowPrice|, not a specific shadow-price value for any zero-flux enzyme. Rows tied at the cap come in a different order with different shadow prices (P4 first in MATLAB, P5 first in geckopy), because the dual of a degenerate vertex depends on the solver (enzyme_usage_edge_cases_ectestgem). On ecYeastGEM many enzymes share the pool's dual (-0.0035243 on the tutorial model, -0.0033119 on 9.1.1) and carry no flux or a negligible one, so the top 20 are an arbitrary subset of the tie: the lists share none of their 20 enzymes on the tutorial model and one on 9.1.1, and the shadow price of every listed enzyme agrees (ec_analysis_ecyeastgem, ec_analysis_ecyeastgem911). With the scipy solver the shadow prices come from the HiGHS row marginals (geckopy.solver_support.constraint_shadow_prices, python-only), and get_enzyme_bottlenecks and Enzyme.shadow_price give the prices of the Gurobi and GLPK interfaces. For the tied rows of ecTestGEM the scipy solver lands on the vertex MATLAB reports (P4 first, price -1.35), so tied_bottlenecks has no difference with scipy (enzyme_usage_edge_cases_ectestgem).
