  - matlab: getPfbaEnzymes
    python: geckopy.pfba_enzymes
    status: parity
    scenarios:
      - enzyme_usage_edge_cases_ectestgem
      - ec_analysis_ecyeastgem
      - ec_analysis_ecyeastgem911
    differs:
      - pfba_fraction_09.value
    notes: >-
      pFBA variant minimising total usage_prot_* flux (enzyme mass) instead of all fluxes. The default fraction of the optimum is 0.999999 on both sides: getPfbaEnzymes multiplies the fraction (default 1) by 0.999999, the margin solveLP's minFlux=1 technique uses (1.000001 for a negative objective), and pfba_enzymes has 0.999999 as its default fraction_of_optimum. The default calls give the same objective, usage sum and fluxes (control_pfba in enzyme_usage_edge_cases_ectestgem; pfba in ec_analysis_ecyeastgem and ec_analysis_ecyeastgem911 on every solver pair run, with the objective over the optimum 0.999999 on both sides). A given fraction differs by the margin: MATLAB multiplies it by 0.999999 and geckopy uses it as it is, so with 0.9 the growth over the optimum is 0.8999991 in MATLAB and 0.9 in geckopy (growth 2.027883905 and 2.0278859328, usage sum 1.6429615 and 1.6429631; pfba_fraction_09 in enzyme_usage_edge_cases_ectestgem, the same on every solver pair run). Reports a primal solution (fluxes), which is stable across repeated runs, unlike getEnzymeBottlenecks' dual-degeneracy finding. usage_prot_<id> reactions with lb<0 (reverse flux) are rejected rather than silently minimised incorrectly; this is not reachable through any real GECKO 3 ecModel today.
