# Parity ledger --- gecko
#
# One row per public function on either side. `parity check` fails if a public
# function is missing here, or if a row names something that no longer exists.
#
# status:
#   parity          Both sides implement this and are intended to behave the same.
#   python-pending  MATLAB has it; a Python port is queued.
#   matlab-pending  Python has it; a MATLAB back-port is queued.
#   matlab-only     Deliberately MATLAB-only --- not coming to Python.
#   python-only     Deliberately Python-only --- not going to MATLAB.
#   via-dependency  The other side gets this from a dependency (cobrapy, COBRA Toolbox) instead.
#   subsumed        The other side has the capability inside another function, not as its own entry point.
#   internal        Not part of the cross-implementation API (glue, installers, helpers).
#   unreviewed      Not yet triaged. Drive this count to zero.
#
# differs (optional, per row): the checkpoints where the linked scenarios still differ, as path
#   prefixes without the leading `results.` and without list indices (for example
#   `written.lines`). `parity ledger-audit --results <run>` rebuilds the differences of each
#   linked scenario from the run and fails when a listed prefix matches none of them. `[]` says
#   the row has no difference of its own; it needs a note.
# strict_differs: true (top level): every parity row linked to a scenario that differs must
#   have a `differs` list, and every group of differences (the first two path segments) of such a
#   scenario must be covered by the `differs` of at least one row that links it: an entry covers a
#   group when it is the group or goes deeper, and an entry must be the start of the path of a
#   difference the run shows.
#
# Regenerate the human-readable view with: parity report --pair gecko

version: 1
pair: gecko
strict_differs: true
matlab: CompMetEng/GECKO
python: CompMetEng/geckopy

entries:
  - matlab: adapterTemplate
    status: subsumed
    reason: Adapter skeleton generation lives in the `geckopy init` CLI and templates/model_adapter.toml rather
      than in a library function.
  - matlab: fillCarbonNum
    status: internal
    reason: Helper of evotuneScore (adds a per-reaction carbon weight for CMA-ES tuning's RMSE, clamping the
      biomass reaction and zero-carbon exchanges to a nonzero weight), not a standalone entry point.
  - matlab: addCarbonNum
    status: subsumed
    reason: Deprecated alias for fillCarbonNum (src/deprecated/addCarbonNum.m); warns with GECKO:deprecatedName
      and forwards to it. Not a separate function to track.
  - matlab: addNewRxnsToEC
    python: geckopy.add_new_rxns_to_ec
    status: parity
    scenarios:
      - model_edits_ectestgem
      - ec_model_edit_edge_cases_ectestgem
    differs:
      - add_new_rxns.no_new_enzymes
    notes: >-
      Both sides add the reactions and enzymes and give the same model fields, including a nested gene rule expanded to isozymes and a gene id that contains 'or'. They differ when no new enzyme is needed (the rule's genes already have enzymes): MATLAB raises, geckopy adds the reaction (ec_model_edit_edge_cases_ectestgem).
  - matlab: applyComplexData
    python: geckopy.apply_complex_data
    status: parity
    scenarios:
      - enzyme_annotation_ectestgem
      - complex_data_edge_cases_ectestgem
      - ec_model_build_light_humangem
    differs:
      - complexes.partial_zero
    notes: >-
      Both sides assign a complex's stoichiometry by protein id, apply the first of two identical complexes and apply nothing for a superset or a complex of unknown proteins. They differ for a partial stoichiometry [2, 0]: MATLAB counts only the non-zero entries as subunits, matches one of the two model proteins and applies nothing, geckopy applies 2 for the first and 1 for the second (complex_data_edge_cases_ectestgem).
  - matlab: applyCustomKcats
    python: geckopy.apply_custom_kcats
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - kcat_apply_edge_cases_ectestgem
      - ec_model_build_yarrowia
    differs: []
    notes: >-
      A mode-A row (reaction id only, no protein listed) writes ec.kcat, sets ec.source to 'custom' and appends the note, as modes B and C do, on both sides. Both skip a blank kcat, append nothing for an empty note, match protein and reaction ids exactly, apply a protein-only row on a light model and read a quoted reaction list without its quotes. No difference of its own in kcat_apply_edge_cases_ectestgem, which differs for other functions.
  - matlab: applyKcatConstraints
    python: geckopy.apply_kcat_constraints
    status: parity
    scenarios:
      - kcat_chain_ectestgem
      - ec_model_full_yeastgem
      - kcat_apply_edge_cases_ectestgem
      - ec_analysis_ecyeastgem
      - ec_analysis_ecyeastgem911
      - ec_model_build_light_humangem
      - ec_model_build_yarrowia
    differs:
      - light_update_ids.cobra_id
      - light_update_ids.ec_id
    notes: >-
      [3->4] writes coefficients with the forward-direction usage_prot_* / prot_pool_exchange convention. In the full formulation, two enzyme rows mapping to the same prot_<accession> metabolite (distinct genes sharing one UniProt entry) are summed on both sides, with every kcat 0 the old coefficients are cleared, and an empty update list means all reactions. In the light formulation, an isozyme with no usable kcat (and a row without enzymes or without a positive enzyme mass) is excluded before selecting the cheapest isozyme on both sides (GECKO#463), and when only some rows of a reaction are named every isozyme of it competes for the cheapest cost. The sides differ in the id vocabulary of the update list: MATLAB takes cobra reaction ids and geckopy takes ec reaction ids (kcat_apply_edge_cases_ectestgem).
      With every kcat 0 on a light ecModel MATLAB returns the model unchanged, while geckopy clears the pool coefficient of the affected reactions.
      On the scipy solver geckopy writes the pool coefficients on glpk and moves the model to the sparse scipy problem in one pass (geckopy.solver_support, python-only), so the build of the light Human-GEM ecModel matches MATLAB with GLPK and with Gurobi, and its Python step takes 6.8 and 6.9 minutes against 2.1 minutes on Gurobi (ec_model_build_light_humangem).
  - matlab: bestParsimonious
    status: python-pending
    scenarios:
      - evotune_edge_cases_ectestgem
    differs:
      - helpers.best_with_nan
    notes: >-
      Picks the sparsest CMA-ES kcat-tuning result within tolerance of the best RMSE on a parsimony frontier. geckopy's kcat_tuning.evotune.parsimony module (geckopy#51) implements the same frontier sweep; best_parsimonious itself is an internal helper there, not exported through __all__. geckopy has best_parsimonious in kcat_tuning/evotune/parsimony.py, which is not exported through __all__. With a NaN RMSE at the first point MATLAB takes min(rmses), which skips NaN, and returns a point; geckopy takes the min over the points, gets NaN, finds no point within tolerance and raises ValueError (evotune_edge_cases_ectestgem).
  - matlab: cmaesKcatTuning
    python: geckopy.kcat_tuning.evotune.cmaes_kcat_tuning
    status: parity
    scenarios:
      - evotune_edge_cases_ectestgem
    differs:
      - cmaes_flat.n_generations
    notes: >-
      Main CMA-ES kcat-tuning entry point (GECKO#477, closes raven-gecko-parity#21). Its docstring says it was written to match "what geckopy's own port actually runs"; that port is kcat_tuning.evotune.tuning.cmaes_kcat_tuning (geckopy#51). With a flat objective the sides differ: cmaesKcatTuning runs all max_generations generations, cmaes_kcat_tuning hands the search to cma, whose own stopping criteria apply, and stops after 1 generation; neither changes a kcat (evotune_edge_cases_ectestgem).
  - matlab: ecStatsFromBrenda
    status: python-pending
    scenarios:
      - kcat_review_stats_ectestgem
    differs:
      - ec_stats.ec
      - ec_stats.kcat_median
      - ec_stats.values
      - lowercase_ec_in_mw.stats
    issue: CompMetEng/raven-gecko-parity#123
    notes: >-
      Summarises loadBRENDAdata's output per EC number for reviewKcatAssignment. Its docstring says it is ported from geckopy's ec_stats_from_brenda (gather_kcats/review.py). The MATLAB function carries a TODO: loadBRENDAdata returns one aggregate column, so kcatMedian is always NaN. geckopy has ec_stats_from_brenda in gather_kcats/review.py, which is not exported through __all__. ecStatsFromBrenda always gives kcatMedian NaN and holds the values of one aggregate column; ec_stats_from_brenda gives the median of the medians and holds maxima and medians. MATLAB upper-cases the EC keys ('3.5.1.N3') and geckopy keeps them (kcat_review_stats_ectestgem).
  - matlab: evotuneScore
    python: geckopy.kcat_tuning.evotune.evotune_distance
    status: parity
    notes: 'Scores one candidate kcat set (simulate + RMSE). geckopy splits this across kcat_tuning.evotune.simulate.simulate_evotune_dataset (the
      simulate half, internal there) and kcat_tuning.evotune.distance.evotune_distance/dataset_rmse (geckopy#51,
      the RMSE half --- evotune_distance is the top-level entry point, dataset_rmse its per-dataset helper).'
  - matlab: isozymeTieMap
    status: python-pending
    notes: Groups isozyme-copy kcat rows sharing a base reaction/prior/source into one tied tuning parameter.
      geckopy's kcat_tuning.evotune.tying.isozyme_tie_map (geckopy#51) does the same, but is an internal
      helper there, not yet re-exported as public API.
  - matlab: loadEvotuneData
    python: geckopy.kcat_tuning.evotune.load_evotune_data
    status: parity
    notes: 'Loads the optional flux/max-growth/zero-flux experimental TSVs for CMA-ES tuning. Matches kcat_tuning.evotune.data.load_evotune_data (geckopy#51).'
  - matlab: nChanged
    status: python-pending
    scenarios:
      - evotune_edge_cases_ectestgem
    differs: []
    notes: >-
      Counts kcats moved from their prior beyond a relative tolerance. geckopy's kcat_tuning.evotune.parsimony.n_changed (geckopy#51) does the same but is an internal helper there, not yet re-exported as public API. geckopy has n_changed in kcat_tuning/evotune/parsimony.py, which is not exported through __all__. The helper cases of evotune_edge_cases_ectestgem agree for it. No difference of its own in evotune_edge_cases_ectestgem, which differs for other functions.
  - matlab: parsimonyFrontier
    status: python-pending
    scenarios:
      - evotune_edge_cases_ectestgem
    differs: []
    notes: >-
      Sweeps a revert threshold, reporting the RMSE-vs-sparsity trade-off. geckopy's kcat_tuning.evotune.parsimony.parsimony_frontier (geckopy#51) does the same but is not yet re-exported as public API. geckopy has parsimony_frontier in kcat_tuning/evotune/parsimony.py, which is not exported through __all__. The helper cases of evotune_edge_cases_ectestgem agree for it. No difference of its own in evotune_edge_cases_ectestgem, which differs for other functions.
  - matlab: resolveTunableContext
    status: subsumed
    reason: Resolves the tunable kcat subset, source-group tiers, and tie groups shared by screenKcatLeverage
      and cmaesKcatTuning. geckopy has the same capability, but
      split across kcat_tuning.evotune.priors.classify_kcat_source(s)/build_sigma0_log and
      kcat_tuning.evotune.tying.isozyme_tie_map rather than one function of its own. A source with a
      detail, such as 'combined (sd=0.10, n=2)', is in the group of its name before ' (' on both sides.
  - matlab: reviewKcatAssignment
    status: python-pending
    scenarios:
      - kcat_review_stats_ectestgem
    differs:
      - review_hand_stats.findings
      - review_hand_stats_optional.findings
      - review_hand_stats_top.findings
      - review_loader_stats.findings
    issue: CompMetEng/raven-gecko-parity#123
    notes: >-
      Flags kcat assignments (largest corrections, biggest outliers) that deserve curator review. geckopy has review_assignment (gather_kcats/review.py), which is not exported through __all__. Both rank by leverage and report a parameter once for tied isozymes. geckopy has review_assignment in gather_kcats/review.py, which is not exported through __all__. With identical statistics the sides differ in the case of the source only: MATLAB compares 'custom' and 'standard' with strcmpi, geckopy exactly. With loader statistics MATLAB cannot flag ec-maximum and finds no statistics for an EC with a lowercase letter (kcat_review_stats_ectestgem).
  - matlab: screenKcatLeverage
    python: geckopy.kcat_tuning.evotune.screen_kcat_leverage
    status: parity
    scenarios:
      - evotune_edge_cases_ectestgem
    differs:
      - screen_control.order
      - screen_max_growth_weight.order
      - screen_no_formulas.order
      - screen_no_formulas.raised
      - screen_no_formulas.rows
      - screen_source_suffix.order
      - screen_zero_flux_known.order
    notes: >-
      Pre-tuning report of which kcats the data can actually constrain, no optimization run. Matches kcat_tuning.evotune.tuning.screen_kcat_leverage (geckopy#51). Leverage, rank and sigma0_log agree; a source with a detail such as 'combined (sd=0.10, n=2)' is in the group of its name before ' (' on both sides (such a kcat gets the sigma0 of that group). The sides differ in the order of rows of equal rank (a stable sort in MATLAB, pandas sort_values in geckopy) and for a model without metFormulas (MATLAB raises, geckopy gives every exchange the carbon weight 1) (evotune_edge_cases_ectestgem).
  - matlab: selectTunableMask
    python: geckopy.kcat_tuning.evotune.select_tunable_mask
    status: parity
    scenarios:
      - evotune_edge_cases_ectestgem
    differs: []
    notes: >-
      Builds a boolean tunable mask from a leverage screen at a target impact share. Matches kcat_tuning.evotune.tuning.select_tunable_mask (geckopy#51). The masks agree at the impact shares 0.5, 0.9 and 1.0 (evotune_edge_cases_ectestgem, which differs for other functions).
  - matlab: tunePriorPenaltyWeight
    python: geckopy.kcat_tuning.evotune.tune_prior_penalty_weight
    status: parity
    notes: 'Sweeps priorPenaltyWeight across seeds, reporting fit vs. cross-seed reproducibility. Matches
      kcat_tuning.evotune.tuning.tune_prior_penalty_weight (geckopy#51).'
  - matlab: fetchBrendaAsset
    python: geckopy.databases.fetch_brenda_asset
    status: parity
    notes: Downloads (once) the BRENDA files of the toolbox-assets release and returns their folder.
  - matlab: resolveKcatAggregation
    status: subsumed
    reason: 'Settles which BRENDA aggregate (max or median) the kcat sources read. geckopy has no
      function of this name: kcats_from_brenda reads adapter.params.kcat_aggregate_brenda, lower-cases
      it and accepts only max or median where the source is gathered.'
  - matlab: assignKcats
    python: geckopy.assign_kcats
    status: parity
    scenarios:
      - kcat_assignment_pipeline_ectestgem
    differs: []
    notes: >-
      Decides one kcat per reaction from the kcat source files and applies them to the ecModel. MATLAB returns a model copy plus the decisions and the report; geckopy works in place and returns (decisions, report). kcat, spread, candidates and ec.source agree: the source is the lower case snake_case label followed by the wildcard level and origin of a BRENDA match in brackets, such as 'brenda (wc=0, origin=1)' (kcat_assignment_pipeline_ectestgem).
  - matlab: collectKcats
    python: geckopy.collect_kcats
    status: parity
    scenarios:
      - kcat_assignment_pipeline_ectestgem
    differs: []
    notes: >-
      Decides one kcat per reaction from the kcat source files in data/kcats, without applying them. A source file that several tokens of one stage name (database_top and database_bottom both read brenda.tsv) is one list on both sides, so kcat, spread, candidates and the source text of a decision ('brenda (wc=0, origin=1)') agree. A leading okp_ of a row's source label is dropped when the labels of a file are put into the priority, as in geckopy (kcat_assignment_pipeline_ectestgem).
  - matlab: convertCustomKcats
    python: geckopy.convert_custom_kcats
    status: parity
    scenarios:
      - upgrade_gecko3_ectestgem
    differs: []
    notes: >-
      Converts a GECKO 3 data/customKcats.tsv into the curated source file data/kcats/custom.tsv. Both sides write the same data/kcats/custom.tsv for the stock customKcats.tsv and for one with an empty notes cell and two rows for one reaction (upgrade_gecko3_ectestgem, whose other cases differ). No difference of its own in upgrade_gecko3_ectestgem, which differs for other functions.
  - matlab: ecTreeEstimate
    status: python-pending
    scenarios:
      - kcat_assignment_pipeline_ectestgem
    differs: []
    issue: CompMetEng/geckopy#68
    notes: >-
      EC-tree kcat estimates for a list of EC numbers, from the median log10 kcat of the measurements up the tree. geckopy has the same estimate as ECTree.estimate (gather_kcats/ec_tree.py), a method of a class that is not exported through __all__, so there is no public function to pair with. Both sides raise for k = NaN, k = 0 and a negative k (kcat_assignment_pipeline_ectestgem).
  - matlab: extractEnzymeSubstratePairs
    python: geckopy.gather_kcats.extract_enzyme_substrate_pairs
    status: parity
    notes: Lists the enzymes and substrates of each model.ec reaction, the input of the DLKcat, OKP and
      homolog sources.
  - matlab: getEcRxnKeys
    python: geckopy.gather_kcats.ec_rxn_keys
    status: parity
    notes: Build-independent keys of the model.ec reactions, which kcat source files use to identify a
      reaction.
  - matlab: kcatAssignmentConfig
    status: python-pending
    scenarios:
      - kcat_assignment_pipeline_ectestgem
    differs: []
    issue: CompMetEng/geckopy#68
    notes: >-
      Reads [kcat_assignment] and [kcat_sources.*] of model_adapter.toml. geckopy has the same reader as kcat_assignment_config (gather_kcats/kcat_assignment.py), which is not exported through __all__. geckopy validates [kcat_assignment] with a schema; kcatAssignmentConfig raises kcatAssignment:config for the same values: a capitalised criteria, an empty preset and a stage whose sources is not a list (kcat_assignment_pipeline_ectestgem).
  - matlab: kcatsFromBrenda
    python: geckopy.kcats_from_brenda
    status: parity
    notes: Gathers kcats from BRENDA by fuzzy matching and keeps them as a source file.
  - matlab: kcatsFromDLKcat
    python: geckopy.kcats_from_dlkcat
    status: parity
    notes: Predicts kcats with DLKcat and keeps them as a source file.
  - matlab: kcatsFromECTree
    python: geckopy.kcats_from_ec_tree
    status: parity
    scenarios:
      - kcat_assignment_pipeline_ectestgem
    differs: []
    notes: >-
      Estimates kcats from the EC tree and keeps them as a source file. An ecRxns given explicitly as an empty list selects no reaction on both sides (MATLAB selects all reactions when ecRxns is left out); a reaction named more than once gives one row, in the order of model.ec.rxns (kcat_assignment_pipeline_ectestgem).
  - matlab: kcatsFromHomologs
    python: geckopy.kcats_from_homologs
    status: parity
    notes: Estimates kcats from measured homologs (DIAMOND) and keeps them as a source file.
  - matlab: kcatsFromOKP
    python: geckopy.kcats_from_okp
    status: parity
    notes: Gathers kcats from OpenKineticsPredictor and keeps them as a source file.
  - matlab: loadBrendaMeasurements
    python: geckopy.databases.load_brenda_measurements
    status: parity
    scenarios:
      - kcat_review_stats_ectestgem
    differs:
      - measurements.meas_both
      - measurements.meas_xz
    notes: >-
      Loads measurements.tsv from the BRENDA database folder. geckopy prefers measurements.tsv.xz when it is present; MATLAB reads only measurements.tsv. A folder with only measurements.tsv.xz raises in MATLAB, and a folder with both files gives different tables (kcat_review_stats_ectestgem).
  - matlab: loadKcatSource
    python: geckopy.load_kcat_source
    status: parity
    scenarios:
      - kcat_io_edge_cases_ectestgem
    differs: []
    notes: >-
      Reads a kcat source file and maps its rows to an ecModel. geckopy also exports read_kcat_source, which reads the file without a model. A row of empty quoted fields is skipped on both sides, as a row of tabs is, and a field that opens a double quote and does not close it raises (loadKcatSource:quote in MATLAB, ValueError in geckopy) (kcat_io_edge_cases_ectestgem).
  - matlab: saveKcatSource
    python: geckopy.save_kcat_source
    status: parity
    scenarios:
      - kcat_io_edge_cases_ectestgem
    differs: []
    notes: >-
      Writes a kcatList to a kcat source file of the project. Both sides write a tab or line break of the detail text as a space and leave no leading, trailing or repeated '; ' in the detail column, so a row is never split (kcat_io_edge_cases_ectestgem, whose other cases differ). No difference of its own in kcat_io_edge_cases_ectestgem, which differs for other functions.
  - matlab: updateKcatSources
    python: geckopy.update_kcat_sources
    status: parity
    notes: Gathers the kcat source files that [kcat_assignment] in model_adapter.toml needs.
  - matlab: upgradeEcModel
    python: geckopy.upgrade_ec_model
    status: parity
    scenarios:
      - upgrade_gecko3_ectestgem
      - ec_model_io_eciyali5
    differs:
      - upgrade_raw.value.changed
      - yaml_round_trip.reverse
    notes: >-
      Brings an ecModel made with GECKO 3 to the GECKO 4 format. The in-memory upgrade agrees for a reverse model and for a forward model with a negative lower bound. The readers differ before it runs: geckopy's reader turns every usage and pool reaction with a negative lower bound forward and leaves the objective alone, MATLAB's readYAMLmodel leaves the model as written and upgradeEcModel then turns it, objective coefficients included, so the objective of a GECKO 3 model keeps its GECKO 3 sign in geckopy and not in MATLAB (upgrade_gecko3_ectestgem). The number of reactions the upgrade turns differs for the same reason: on eciYali5-GEM it is 895 in MATLAB and 0 in geckopy, whose reader has turned them already, and the model after the upgrade agrees (ec_model_io_eciyali5).
  - matlab: upgradeGECKOproject
    python: geckopy.upgrade_project
    status: parity
    scenarios:
      - upgrade_gecko3_ectestgem
    differs:
      - projects.forward_model_negative_lb
      - projects.no_toml
      - projects.stored_dlkcat_foreign_substrates
    notes: >-
      Brings a GECKO 3 project to the GECKO 4 layout (dry run by default). Dry runs and applying the upgrade twice agree. For a GECKO 4 model with a negative lower bound on a usage reaction, upgrade_project reports '2 protein reactions turned forward' and rewrites the file, upgradeGECKOproject reports nothing. For a project with an adapter class and no model_adapter.toml, upgradeGECKOproject converts the class and upgrade_project lists the adapter 'by hand' and skips the custom kcats and predictions. kcatsFromDLKcat raises on a stored DLKcat output with substrates the model lacks, kcats_from_dlkcat drops those rows (upgrade_gecko3_ectestgem).
  - matlab: TomlAdapter
    status: subsumed
    reason: geckopy.ModelAdapter.from_folder is already configured by model_adapter.toml. This is the MATLAB class
      that gives GECKO the same.
  - matlab: loadAdapterParams
    status: subsumed
    reason: Reads model_adapter.toml into the adapter parameters, which geckopy does in ModelAdapter.from_folder
      (validated by ModelParameters).
  - matlab: readAdapterToml
    status: via-dependency
    reason: MATLAB has no TOML parser, so this reads the subset that adapter files use. Python uses the standard
      library tomllib.
  - matlab: writeAdapterToml
    status: internal
    reason: Helper of convertAdapterToToml, the inverse of readAdapterToml. geckopy writes its template with `geckopy
      init`.
  - matlab: convertAdapterToToml
    status: matlab-only
    reason: Converts a GECKO 3 or 4 ModelAdapter class to model_adapter.toml. geckopy adapters have always been TOML,
      so there is no class to convert.
  - python: geckopy.kcat_tuning.evotune
    status: internal
    reason: Re-exports the evotune subpackage as a namespace on kcat_tuning; not a function of its own.
  - python: geckopy.kcat_tuning.corrections
    status: python-only
    reason: 'Reports a completed cmaes_kcat_tuning run as a ranked list of changed kcats with provenance
      (EvotuneResult.corrections() calls it) --- no tracked MATLAB equivalent report.'
  - python: geckopy.kcat_tuning.Correction
    status: internal
    reason: Return type of corrections()/EvotuneResult.corrections(), not a standalone entry point.
  - python: geckopy.kcat_tuning.corrections_tsv
    status: internal
    reason: TSV serializer for corrections()'s output, not a standalone entry point.
  - python: geckopy.kcat_tuning.annotate_from_model
    status: internal
    reason: Looks up names/EC codes/sources for corrections(), not a standalone entry point.
  - python: geckopy.kcat_tuning.evotune.EvotuneData
    status: internal
    reason: Return type of load_evotune_data, not a standalone entry point.
  - python: geckopy.kcat_tuning.evotune.EvotuneResult
    status: internal
    reason: Return type of cmaes_kcat_tuning, not a standalone entry point.
  - python: geckopy.kcat_tuning.evotune.ConditionSimResult
    status: internal
    reason: Return type of simulate_evotune_dataset, not a standalone entry point.
  - python: geckopy.kcat_tuning.evotune.simulate_evotune_dataset
    status: internal
    reason: 'FBA simulation half shared by evotuneScore''s Python port (evotune_distance/dataset_rmse score
      the result) and the tuning/screening loop''s per-candidate scoring; not a standalone entry point.'
  - python: geckopy.kcat_tuning.evotune.dataset_rmse
    status: internal
    reason: Per-dataset RMSE helper of evotune_distance, evotuneScore's Python port; not a standalone entry point.
  - python: geckopy.kcat_tuning.evotune.compute_excarbon
    status: internal
