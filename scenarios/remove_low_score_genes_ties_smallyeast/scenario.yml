id: remove_low_score_genes_ties_smallyeast
pair: raven
description: >-
  removeLowScoreGenes when scores tie. With every isozyme alternative
  negative and equal, both sides keep the gene (or complex) listed first in
  the rule, not the alphabetically first one.

entries:
  - removeLowScoreGenes

inputs:
  model: "{matlab_repo}/tutorials/data/models/smallYeast.yml"

  # Synthetic rules replace three real ones through changeGrRules /
  # change_gene_reaction_rules (already cross-validated by
  # change_gene_rules_smallyeast). The gene ids are chosen so that the order in
  # the rule and the alphabetical order disagree.
  #
  #   PGI  "G2 or G1", both -1. A tie between two genes. First in the rule is
  #        G2; the alphabetical answer would be G1.
  #
  # Real rules in smallYeast have no AND, so the complex tie uses its own ids.
  #
  #   PFK  "(C3 and C4) or (C1 and C2)", every gene -1. A tie between two
  #        complexes (the minimum of each is -1). First in the rule is
  #        C3 and C4.
  #   HXK  "H3 or H2 or H1", H2 positive, H1 and H3 negative. Not a tie: only
  #        H2 survives. Guards the non-tie path against the same change.
  synthetic_rules:
    - reaction: PGI
      grRule: "G2 or G1"
    - reaction: PFK
      grRule: "(C3 and C4) or (C1 and C2)"
    - reaction: HXK
      grRule: "H3 or H2 or H1"

  scores:
    G1: -1.0
    G2: -1.0
    C1: -1.0
    C2: -1.0
    C3: -1.0
    C4: -1.0
    H1: -1.0
    H2: 1.0
    H3: -1.0

  isozyme_scoring: max
  complex_scoring: min

tolerance:
  rel: 0.0
  abs: 0.0
