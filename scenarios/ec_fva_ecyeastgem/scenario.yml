id: ec_fva_ecyeastgem
pair: gecko
description: >-
  Flux variability analysis on the full_ecModel tutorial ecYeastGEM, constrained by the tutorial's flux data, over all 4000-odd reactions of the conventional yeast-GEM: the minimum and maximum flux of every reaction with growth free below the measured rate and with growth fixed at it.

entries:
  - ecFVA
  - constrainFluxData
  - mapRxnsToConv

# ec_fva_ectestgem runs ecFVA on six reactions, one of which has an isozyme split. On ecYeastGEM about 600 conventional reactions are split per isozyme or per direction, so how the bounds of a split reaction are combined, which the small scenario checks on one reaction, has hundreds of chances to show a difference.
#
# The ecModel is constrained as in the tutorial's stage 4 (constrainFluxData with the first condition of data/fluxData.tsv, growth as the upper bound, loose exchange bounds) with the growth rate set to the 0.088 per hour of the tutorial's later steps. `free` leaves growth anywhere up to that rate; `fixed` also sets the lower bound of growth to it. Every conventional reaction is a record of its two bounds; a reaction whose LP is infeasible has no bound on either side and is recorded as NaN.
#
# Solver tolerances. RAVEN's solveLP gives Gurobi FeasibilityTol and OptimalityTol of 1e-9 (optimizeProb.m), and geckopy sets the same value on a model it loads. `free` and `fixed` set the tolerance of the python model to that value (python_tolerance); both agree with MATLAB on every one of the 4102 reactions at 1e-6, the reactions with an isozyme or direction split included, so the two algorithms are the same. With the python model set to cobrapy's 1e-6 instead and growth fixed, which leaves the LP almost no room, geckopy's ec_fva reports wider ranges: 1944 of the 4102 reactions differ from MATLAB by more than 1e-6 (2535 of the 8204 bounds, by up to 0.97), and geckopy's range is the wider one for 1922 of them and the narrower one for 28.
#
# Solvers. With the scipy solver in geckopy (PARITY_PYTHON_SOLVER=scipy, Gurobi in MATLAB) `free` agrees on all 8204 bounds and `fixed` differs for one bound (the minimum of r_2720: -173.615 with scipy against -173.3495 with Gurobi in both toolboxes, 0.15 percent relative); the cause is the accuracy of HiGHS on these ill-scaled LPs, a limit of the solver. The Python part takes about 100 minutes on scipy. With GLPK in MATLAB the MATLAB step did not finish within 36 hours on 4 cores, so GLPK combinations are not part of the evidence.
#
# MATLAB's ecFVA runs on a parallel pool of the job's cores and geckopy's ec_fva on as many worker processes (python_n_proc); the number of workers does not change a result.
inputs:
  adapter_matlab: "{matlab_repo}/tutorials/full_ecModel"
  adapter_python: "{matlab_repo}/tutorials/full_ecModel"
  model_file: ecYeastGEM.yml
  flux_data_file: "{matlab_repo}/tutorials/full_ecModel/data/fluxData.tsv"

  matlab_solver: gurobi
  python_solver: gurobi
  python_n_proc: 8
  python_tolerance: 1.0e-9

  bio_rxn: r_4041
  c_source: r_1714
  growth_rate: 0.088

tolerance:
  rel: 1.0e-6
  abs: 1.0e-6
