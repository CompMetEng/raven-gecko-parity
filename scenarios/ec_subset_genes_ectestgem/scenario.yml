id: ec_subset_genes_ectestgem
pair: gecko
description: >-
  getSubsetEcModel and get_subset_ec_model with a context-specific model that lacks a reaction of the full ecModel and also a gene of that reaction while it keeps the other genes of its rule: the shape of a tissue or cell-line model made from a larger model.

entries:
  - getSubsetEcModel

# ec_lookup_edge_cases_ectestgem cuts a reaction out of the model (with its genes) and a gene out of a rule. Cutting a reaction while its gene is cut separately is the common case of context-specific models, which keep the other genes of the rule. R2 of ecTestGEM has the rule `G1 and G2 or G3`.
#
# Both flavours of ecModel are cut: the full one, where every reaction has one gene set after the isozyme split, and the light one, where R2 keeps its rule `G1 and G2 or G3`.
#
# `drop_reaction_and_gene`: the context model has no R2 and no G3, but has G1 and G2 (they stay in its gene list). In the light ecModel R2 survives the removal of G3 (G1 and G2 satisfy the rule) and is then removed because the context model lacks it; in the full ecModel R2 is split per isozyme and the isozyme of G3 goes with the gene. Both sides return the same model in both flavours. `drop_reaction`: the context model lacks R2 and every gene that belonged to R2 alone. `identity`: the context model is the full conventional model, so no gene is removed and both sides return the model unchanged.
#
# A raise is a result on both sides. The same function on real data is ec_analysis_light_humangem (HT29-GEM of the light_ecModel tutorial).
inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

tolerance:
  rel: 0.0
  abs: 0.0
