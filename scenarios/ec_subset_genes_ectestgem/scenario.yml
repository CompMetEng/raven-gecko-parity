id: ec_subset_genes_ectestgem
pair: gecko
description: >-
  getSubsetEcModel and get_subset_ec_model with a context-specific model that lacks a reaction of the full ecModel and also a gene of that reaction while it keeps the other genes of its rule: the shape of a tissue or cell-line model made from a larger model.

entries:
  - getSubsetEcModel

# ec_lookup_edge_cases_ectestgem cuts a reaction out of the model (with its genes) and a gene out of a rule. Cutting a reaction while its gene is cut separately is the common case of context-specific models, which keep the other genes of the rule. R2 of ecTestGEM has the rule `G1 and G2 or G3`.
#
# Both flavours of ecModel are cut: the full one, where every reaction has one gene set after the isozyme split, and the light one, where R2 keeps its rule `G1 and G2 or G3`.
#
# `drop_reaction_and_gene`: the context model has no R2 and no G3, but has G1 and G2 (they stay in its gene list). In the light ecModel R2 survives the removal of G3 (G1 and G2 satisfy the rule) while the gene G3 is removed from the gene list of the model, and R2 is then removed because the context model lacks it. geckopy removes G3 from the gene list first and later removes R2 together with its orphan genes, among which G3 is still a gene of the reaction, so cobra raises that G3 is not found in the gene list. MATLAB's getSubsetEcModel returns the model. In the full ecModel R2 is split per isozyme, the isozyme of G3 goes with the gene and nothing refers to G3 afterwards.
#
# `drop_reaction`: the context model lacks R2 and every gene only R2 used. `identity`: the context model is the full conventional model, so no gene is removed: geckopy returns the copy of the model and MATLAB raises.
#
# A raise is a result on both sides. The reproduction on real data is ec_analysis_light_humangem (HT29-GEM of the light_ecModel tutorial), where geckopy raises that ENSG00000179148 is not found.
inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

tolerance:
  rel: 0.0
  abs: 0.0
