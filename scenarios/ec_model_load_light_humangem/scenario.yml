id: ec_model_load_light_humangem
pair: gecko
description: >-
  loadEcModel and load_ec_model on the light ecModel of GECKO's light_ecModel tutorial, the gecko-light layout of Human-GEM (16021 reactions, 30494 ec reactions), compared field by field as in ec_model_load_ecyeastgem.

entries:
  - loadEcModel

# A gecko-light ecModel keeps one reaction per conventional reaction and carries the enzyme usage in the ec substructure: ec.rxns has one entry per isozyme with a counter prefix, no prot_<id> metabolite or usage reaction exists and a single prot_pool_exchange reaction holds the protein budget. The tutorial file was written by GECKO 3 (RAVEN 2 YAML layout, metaData `geckoLight: "true"`), so this also reads a model that carries the older conventions. The summary is that of ec_model_load_ecyeastgem, which says how lists and non-finite numbers are compared; ec.gecko_light is part of it.
#
# The tutorial file holds 52 ec reactions written as an `enzymes: !!omap` entry with no content (the reactions that carry the standard kcat). MATLAB's reader accepts them; geckopy's reader (raven_toolbox, through ruamel.yaml) raises on a tagged entry without a value. The result `as_published` records what each reader does with the file as it is, as counts; `repaired` is the full summary of a copy from which the empty entries are removed, which both load. Both sides read the file from the tutorial's models/ folder through the adapter folder.
inputs:
  adapter_matlab: "{matlab_repo}/tutorials/light_ecModel"
  adapter_python: "{matlab_repo}/tutorials/light_ecModel"
  model_file: ecModel.yml

tolerance:
  rel: 0.0
  abs: 0.0
