id: ec_model_build_light_humangem
pair: gecko
description: >-
  The light ecModel pipeline of GECKO's light_ecModel tutorial on Human-GEM (11983 reactions, 2421 genes): makeEcModel with geckoLight, applyComplexData, getECfromGEM, BRENDA fuzzy kcat matching, the DLKcat output of the tutorial, the merge of the two, assignKcatValues, getStandardKcat, applyKcatConstraints and setProtPoolSize, compared at each step.

entries:
  - makeEcModel
  - applyComplexData
  - getECfromGEM
  - fuzzyKcatMatching
  - readDLKcatOutput
  - mergeDLKcatAndFuzzyKcats
  - assignKcatValues
  - getStandardKcat
  - applyKcatConstraints
  - setProtPoolSize

# ec_model_full_yeastgem runs the full-layout pipeline on yeast-GEM. This is the gecko-light layout on a human model, which has what yeast lacks: genes with several protein products, reactions without genes that get the standard kcat, a subsystem on every reaction (the standard kcat is the median of the reactions of the same subsystem), reactions that the adapter marks as spontaneous and a DLKcat prediction file of 22 MB that is read at full size.
#
# The steps are those of the tutorial's protocol.m, without the network steps: the UniProt, KEGG, ComplexPortal, SMILES and DLKcat files are the tutorial's own, and BRENDA is the release in GECKO's databases folder (run any GECKO function that loads BRENDA once before this scenario so that the folder exists, as for ec_model_full_yeastgem). Checkpoints:
#   expansion  counts of the conventional and the ecModel, ec.rxns and ec.enzymes
#   complexes  every non-zero entry of the coupling matrix after applyComplexData
#   eccodes    the EC codes after getECfromGEM, per ec reaction in order
#   dlkcat     the rows readDLKcatOutput returns
#   kcats      the merged candidate list, the kcat and source after assignKcatValues, the protein coefficients after applyKcatConstraints and the protein pool bound
#   standard   the result of getStandardKcat (the kcat and source of every ec reaction, the new reactions and enzymes) or that it raised. It runs on a copy: the stages after it continue from the model without the standard kcat on both sides, so that they compare the same state whatever the step does.
#
# Both sides agree at full size on every checkpoint: the 2421 enzymes, the 29321 ec reactions, the 35000 coupling entries, the EC codes, the DLKcat rows, the merged candidates, the kcat and source of every ec reaction after assignKcatValues, the standard kcat of the 1365 reactions without genes (30686 ec rows after getStandardKcat), the protein coefficients and the pool bound. Human-GEM names the subsystem "Pentose phosphate pathway" and also "Pentose Phosphate Pathway"; getStandardKcat and assign_standard_kcat treat the two names as one subsystem (standard_kcat_subsystem_ectestgem reproduces the shape on ecTestGEM).
# make_ec_model reads data/uniprot.tsv by itself and uses data/kegg.tsv only when it is given the database, while makeEcModel always reads both; the python side therefore passes kegg_db. Without it six genes that only KEGG knows (such as ENSG00000139304) stay without an enzyme, which is a convention of the call, not a difference of the algorithm. Four cells of data/uniprotConversion.tsv are quoted (as "P0DPB6;P0DPB5"); both sides read the quoted cells like textscan %q, without the quotes. ec_model_build_yarrowia has the same quoting in data/uniprot.tsv, where it changes the EC codes.
#
# fuzzyKcatMatching's organism-distance step needs a KEGG taxonomy file that is not vendored, so both sides use the two-organism stand-in PhylDist.mat of ec_model_full_yeastgem (see there): the EC and substrate tiers are exercised at full size, the organism tier degrades to the wildcard on both sides. The python side recovers the `eccodes` of the YAML reactions with a second parse of the file, as in ec_model_full_yeastgem. Neither side needs a solver.
inputs:
  adapter_matlab: "{scenario_dir}/HumanGEMAdapterParity.m"
  adapter_python: "{matlab_repo}/tutorials/light_ecModel"
  fixture_dir: "{matlab_repo}/tutorials/light_ecModel"
  databases_dir: "{matlab_repo}/databases"

  matlab_solver: gurobi
  python_solver: gurobi

tolerance:
  rel: 1.0e-9
  abs: 1.0e-12
