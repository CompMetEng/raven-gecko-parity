id: curate_tables_annotation_toy
pair: raven
description: >-
  curateModelFromTables on a model whose metabolites, genes and reaction carry MIRIAM annotations (kegg.compound
  on x and y, ncbigene on G1 and G2, kegg.reaction on the two reactions), a confidence score on each reaction and short
  names on the genes. The cases cover an empty MIRIAM cell of an existing entity (the namespace is removed when
  another existing entity of the table has a value in that column, and kept with the option that keeps stored
  values), a MIRIAM column without a value for any existing entity (kept), new metabolites and reactions whose
  empty charge or confidence score is 0 when the column has a value in another row, table cells that read NA,
  null or None (kept as text), and a rev column written as true and false. Bound cells are NaN (not given), true or
  false in any case (read as 1 and 0), a number with a thousands separator or exponent, or Inf; a cell that is not a number
  (a bound, a rev, a charge or a confidence score) makes both sides stop with an error. A cell with only blanks counts as empty in both modes. The curated content is compared by
  name; it includes the bounds of the reactions but not their rev field, which Python derives from the bounds.

entries:
  - curateModelFromTables

inputs:
  tables_dir: "{scenario_dir}/tables"
  met_prefix: M_
  rxn_prefix: R_
  cases:
    - {name: mets_values, mets: mets_values.tsv, genes: none, rxns: none, coeffs: none}
    - {name: mets_values_kept, mets: mets_values.tsv, genes: none, rxns: none, coeffs: none, overwrite_with_empty: false}
    - {name: mets_empty_column, mets: mets_empty_column.tsv, genes: none, rxns: none, coeffs: none}
    - {name: genes_values, mets: none, genes: genes_values.tsv, rxns: none, coeffs: none}
    - {name: genes_values_kept, mets: none, genes: genes_values.tsv, rxns: none, coeffs: none, overwrite_with_empty: false}
    - {name: rxns_values, mets: none, genes: none, rxns: rxns_values.tsv, coeffs: rxns_coeffs.tsv}
    - {name: rxns_values_kept, mets: none, genes: none, rxns: rxns_values.tsv, coeffs: rxns_coeffs.tsv, overwrite_with_empty: false}
    - {name: bounds_text, mets: none, genes: none, rxns: rxns_bounds.tsv, coeffs: rxns_bounds_coeffs.tsv}
    - {name: bound_not_a_number, mets: none, genes: none, rxns: rxns_bad_bound.tsv, coeffs: rxns_bad_coeffs.tsv}
    - {name: rev_not_a_number, mets: none, genes: none, rxns: rxns_bad_rev.tsv, coeffs: rxns_bad_rev_coeffs.tsv}
    - {name: score_not_a_number, mets: none, genes: none, rxns: rxns_text_score.tsv, coeffs: rxns_one_coeffs.tsv}
    - {name: charge_not_a_number, mets: mets_text_charge.tsv, genes: none, rxns: none, coeffs: none}
    - {name: blank_miriam_cell, mets: mets_blank_cell.tsv, genes: none, rxns: none, coeffs: none}
    - {name: blank_miriam_cell_kept, mets: mets_blank_cell.tsv, genes: none, rxns: none, coeffs: none, overwrite_with_empty: false}
