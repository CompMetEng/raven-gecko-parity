id: kcat_review_stats_ectestgem
pair: gecko
description: >-
  The BRENDA summaries behind the kcat review and the review itself. ecStatsFromBrenda /
  ec_stats_from_brenda summarise a six-row BRENDA folder per EC number (kcat rows, maximum,
  median, the set of values, specific-activity rows; an EC with a lowercase letter, 3.5.1.n3, and
  an EC with specific-activity rows only; a second folder whose mw.tsv and sa.tsv hold a lowercase
  EC, 3.5.1.n4). reviewKcatAssignment / review_assignment run on one set
  of assignments twice: with hand-built statistics, so only the review logic is compared, and with
  the statistics each side builds from the BRENDA folder, so the loader differences show up in the
  findings. A second call reports the optional checks. loadBrendaMeasurements /
  load_brenda_measurements read folders with measurements.tsv only, measurements.tsv.xz only and
  both (different content). The `detail` text of the findings is not compared. A raise is a value
  on both sides. Nothing reaches the network.

# Differences this scenario reports (the run decides, the sources explain):
#   * review_hand_stats, review_hand_stats_optional, review_hand_stats_top, review_loader_stats:
#     the review differs in the case of the source only: MATLAB compares 'custom' and 'standard'
#     with strcmpi, Python exactly, so 'Custom' is checked for a duplicate and 'STANDARD' is
#     treated as the fallback in MATLAB only. ecStatsFromBrenda is called with the max and the
#     median view of loadBRENDAdata; its statistics agree with ec_stats_from_brenda, including an
#     EC with a lowercase letter (ec_stats, lowercase_ec_in_mw).
#   * measurements: both sides read measurements.tsv.xz in preference to measurements.tsv.

entries:
  - ecStatsFromBrenda
  - reviewKcatAssignment
  - loadBrendaMeasurements

inputs:
  project_template: "{python_repo}/examples/ecTestGEM"
  brenda_dir: "{scenario_dir}/data/brenda"
  brenda_lower_mw_dir: "{scenario_dir}/data/brenda_lower_mw"
  meas_tsv: "{scenario_dir}/data/meas_tsv"
  meas_xz: "{scenario_dir}/data/meas_xz"
  meas_both: "{scenario_dir}/data/meas_both"
  scratch: "{repo_root}/results/.kcat_review_stats"

tolerance:
  rel: 1.0e-9
  abs: 1.0e-12
