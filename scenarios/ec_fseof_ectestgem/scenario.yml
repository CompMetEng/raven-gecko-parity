id: ec_fseof_ectestgem
pair: gecko
description: >-
  Flux-Scanning with Enforced Objective Function on ecTestGEM's ecModel:
  enforcing an increasing flux toward a production target while maximising
  growth, to find reactions worth over-expressing, knocking down, or
  removing entirely. Compares the enforced production levels and the set of
  target reactions.

entries:
  - ecFSEOF

# The fifth and last scenario in this pair that needs an LP solver; same reasoning as
# the rest of Tier 3 for declaring it explicitly.
inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

  matlab_solver: gurobi
  python_solver: gurobi

  bio_rxn: R5

  # R3 as the production target rather than an exchange reaction (the docstring's own
  # suggestion, not a requirement): ecTestGEM's only exit pathway is R5->S2, so there is
  # no separate byproduct to enforce that is not just growth itself under another name.
  # R3 is a real, independent degree of freedom instead --- one of three parallel
  # m1->m2 routes (alongside R2's two isozymes and the uncatalysed R4), competing with
  # them for the same upstream precursor and the same protein-pool budget, so enforcing
  # its flux upward has a real, visible effect on the rest of the network to scan.
  prod_target_rxn: R3
  cs_rxn: S1

  # Distinct kcats for R2's two isozymes, the same values ec_fva_ectestgem already
  # verified give a real, non-degenerate trade-off; R3 and R5 kcats chosen so R3 is not
  # the cheapest route (R2_EXP_1 is), which is what makes R3 need to be *enforced* to
  # carry flux at all rather than being used voluntarily.
  kcats:
    R2_EXP_1: 50.0
    R2_EXP_2: 10.0
    R2_REV_EXP_1: 50.0
    R2_REV_EXP_2: 10.0
    R3: 20.0
    R5: 100.0

  n_steps: 6

# Both sides classify a reaction as a target by the correlation between its absolute flux
# and the enforced production flux (RAVEN's FSEOF rule: some absolute flux above 1e-10,
# a nonzero spread, and an absolute correlation of at least 0.9). Both consider only
# reactions with a gene rule, drop the usage_prot_* reactions from the report and keep
# the enforced production reaction itself when it has a gene rule (R3 here, whose flux
# follows the enforced level by definition). Both start the enforced levels at the
# production flux of the growth optimum and end at 90% of the theoretical maximum.
#
# The enforced levels agree to within 1e-6 relative: MATLAB's solveLP(model, 1) relaxes
# the objective it fixes to 0.999999 of its maximum, so the top level is 1295.998704
# where geckopy's exact maximum gives 1296. The tolerance below is 2e-6 for that reason.
#
# The target set and the ranked order of the targets are compared (MATLAB lists rxnTargets in
# rank order, then transportTargets; geckopy lists one table ranked by slope times correlation).
# MATLAB additionally returns the slope as the absolute
# regression slope, the per-gene action and an essentiality column (one knockout LP per
# gene), and splits transport reactions into transportTargets; geckopy's ec_fseof returns
# neither the essentiality nor the split (its notes point callers at
# cobra.flux_analysis.single_gene_deletion).
tolerance:
  rel: 2.0e-6
  abs: 1.0e-9
