id: relax_enz_concs_ectestgem
pair: gecko
description: >-
  relaxEnzConcs / relax_enz_concs on ecTestGEM with the complex of R5 written into ec.rxnEnzMat
  (the `binding` layout of complex_levelling_ectestgem), with perComplex false and true, with the
  measured and the median-levelled concentrations, and with a growth rate that needs the protein pool raised.

entries:
  - relaxEnzConcs

inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

  matlab_solver: gurobi
  python_solver: gurobi

  # The fixture of flexibilize_edge_cases_ectestgem: R2 and R4 blocked, P5 the one binding enzyme.
  kcats:
    R3: 15.0
    R5: 200.0
  exp_growth: 2.5
  # Far above the growth the enzymes alone allow, so the protein pool is raised as well.
  exp_growth_high: 1000.0

  # Rows of ec.rxnEnzMat (copies per subunit) written into the model before levelling. The
  # fixture has one enzyme per reaction except R2_EXP_1 (P1 and P2, one copy each); the layouts
  # replace whole rows, so a reaction with {} has no enzyme. applyKcatConstraints builds the
  # enzyme coefficients of the reaction from these rows, so the layout also changes the LP: in
  # `binding` the flux of R5 uses P1, P2 (two copies) and P5, and R2_EXP_1 uses no enzyme.
  layouts:
    # P5, the enzyme that limits growth, is one subunit of the complex of R5
    binding:
      R2_EXP_1: {}
      R2_EXP_2: {}
      R3: {P4: 1}
      R5: {P5: 1, P2: 2, P1: 1}

# Every case records a raise as a result (`raised`). The relax cases record ec.concs, the relaxed
# enzymes sorted by id with their old and new bounds and the fold, the usage-reaction upper bounds, the
# bound of the protein pool exchange and the growth reached. The tolerance applies to the bounds.
tolerance:
  rel: 1.0e-6
  abs: 1.0e-9
