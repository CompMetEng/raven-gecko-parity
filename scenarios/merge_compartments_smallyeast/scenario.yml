id: merge_compartments_smallyeast
pair: raven
description: >-
  Collapsing every compartment into one: which metabolites are recognised as
  the same species across compartments, how their stoichiometric
  contributions add up, and which reactions vanish because they had nothing
  left to do.

entries:
  - mergeCompartments

inputs:
  # smallYeast has two compartments and seven species present in both
  # (acetyl-CoA, coenzyme A, CO2, and the four nicotinamide cofactors), plus
  # three reactions that exist only to move things between them --- so the
  # merge has grouping, coefficient summing and cancellation to do rather than
  # just relabelling.
  model: "{matlab_repo}/tutorials/data/models/smallYeast.yml"

  # RAVEN's deleteRxnsWithOneMet, false by default on both sides. smallYeast
  # is also merged a second time with every argument left at its default on
  # both sides (the defaults entry of the results), so a change to either
  # default shows up there. With it off, reactions that cancel to *nothing*
  # still go on both sides: CAT2, CO2TRANS and ShuttleX
  # are the model's three transport reactions, and after merging there is
  # nothing left of them. The toy case delete_reactions_with_one_met turns it
  # on.
  delete_single_metabolite_reactions: false

  # Merge into "s" for "System", the RAVEN convention. RAVEN always merges
  # into "s" and the Python side defaults to it; the run with the defaults
  # leaves merged_id unset.
  merged_compartment: s

  # Toy models where the rule that picks the merged metabolite matters. In
  # first_copy_in_model_order_sorts_last the copy that comes first in the
  # model (B_m) sorts after the other (B_c); in copy_already_in_s one copy
  # (C_s) is already in the merged compartment and sorts after the other. The
  # copies carry different ChEBI ids, so the annotation shows which copy was
  # kept. delete_reactions_with_one_met has an exchange reaction (one
  # metabolite before the merge) and a symport A_c + H_c -> A_m that the merge
  # reduces to one metabolite (H).
  toy_cases:
    - name: first_copy_in_model_order_sorts_last
      comps: [c, m]
      metabolites:
        - {id: B_m, name: B, comp: m, chebi: "CHEBI:2"}
        - {id: B_c, name: B, comp: c, chebi: "CHEBI:1"}
        - {id: X_c, name: X, comp: c, chebi: ""}
      reactions:
        - {id: R1, mets: [X_c, B_m], coefficients: [-1, 1], lb: 0, ub: 1000}
        - {id: R2, mets: [B_c, X_c], coefficients: [-1, 1], lb: 0, ub: 1000}
        - {id: EX_X, mets: [X_c], coefficients: [-1], lb: -10, ub: 1000}
    - name: copy_already_in_s
      comps: [c, s]
      metabolites:
        - {id: C_c, name: C, comp: c, chebi: "CHEBI:3"}
        - {id: C_s, name: C, comp: s, chebi: "CHEBI:4"}
        - {id: X_c, name: X, comp: c, chebi: ""}
      reactions:
        - {id: R1, mets: [X_c, C_c], coefficients: [-1, 1], lb: 0, ub: 1000}
        - {id: R2, mets: [C_s, X_c], coefficients: [-1, 1], lb: 0, ub: 1000}
        - {id: EX_X, mets: [X_c], coefficients: [-1], lb: -10, ub: 1000}
    - name: delete_reactions_with_one_met
      delete_single_metabolite_reactions: true
      comps: [c, m]
      metabolites:
        - {id: A_c, name: A, comp: c, chebi: ""}
        - {id: A_m, name: A, comp: m, chebi: ""}
        - {id: H_c, name: H, comp: c, chebi: ""}
        - {id: X_c, name: X, comp: c, chebi: ""}
      reactions:
        - {id: SYM, mets: [A_c, H_c, A_m], coefficients: [-1, -1, 1], lb: 0, ub: 1000}
        - {id: R1, mets: [X_c, A_c, H_c], coefficients: [-1, 1, 1], lb: 0, ub: 1000}
        - {id: R2, mets: [A_m, X_c], coefficients: [-1, 1], lb: 0, ub: 1000}
        - {id: EX_X, mets: [X_c], coefficients: [-1], lb: -10, ub: 1000}

# Metabolites are compared by id, name and ChEBI annotation. RAVEN groups the
# copies by metNames, and the Python side is given the same key here rather
# than its default id-suffix one. Both sides give the merged metabolite the id
# and the other fields of the copy already in "s" if there is one, otherwise
# of the copy whose id sorts first, so acetyl-CoA[c] and acetyl-CoA[m] become
# ACCOA_c on both sides wherever the copies sit in the model. The toy cases
# tell this rule from keeping the first copy in model order: B_c and C_s are
# not the first copies of their species. The stoichiometry is keyed by
# metabolite id.
#
# With deleteRxnsWithOneMet on, both sides keep the reactions that already
# had a single metabolite before the merge (a model's exchange reactions) and
# delete those that the merge reduced to one (SYM in
# delete_reactions_with_one_met).

tolerance:
  # Coefficients are summed when two compartment copies collapse into one, so
  # this is the one place in the scenario where a float is computed rather
  # than copied.
  rel: 1.0e-12
  abs: 1.0e-15
