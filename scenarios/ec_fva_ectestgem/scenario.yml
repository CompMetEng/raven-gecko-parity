id: ec_fva_ectestgem
pair: gecko
description: >-
  Flux variability analysis on ecTestGEM's ecModel, mapped back to the
  conventional model's reactions: the min/max flux each reaction can carry
  while the rest of the enzyme-constrained network stays feasible.

entries:
  - ecFVA

# The second scenario in this pair that needs an LP solver; same reasoning as
# enzyme_usage_ectestgem for declaring it explicitly rather than inheriting a default.
inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

  matlab_solver: gurobi
  python_solver: gurobi

  # geckopy's own parallelism knob, declared rather than left at its default (the
  # machine's own core count): on a 6-reaction model the multiprocessing pool's own
  # startup cost dwarfs the four tiny LP solves it would parallelise. MATLAB's ecFVA has
  # no equivalent serial path --- it always starts a parpool --- so there is nothing to
  # match this against; it only keeps the Python side fast and deterministic.
  python_n_proc: 1

  # R2 is ecTestGEM's only isozyme-split reaction (G1 and G2, forming a complex, or G3
  # alone) --- everything else in the model has at most one enzyme per direction. Distinct
  # kcats for the two isozymes (and their reverse counterparts) give the solver a real
  # trade-off between them, which is what makes the range of R2 depend on how the bounds of an
  # isozyme-split reaction are combined (see below): R1, R3, R4, R5, S1 and S2 all have a single
  # enzyme or none at all, so nothing about *their* bounds depends on how an isozyme choice is
  # resolved.
  kcats:
    R2_EXP_1: 50.0
    R2_EXP_2: 10.0
    R2_REV_EXP_1: 50.0
    R2_REV_EXP_2: 10.0
    R3: 20.0
    R5: 100.0

  # Neither R2 nor R4 is blocked here, unlike enzyme_usage_ectestgem: that scenario needed
  # a unique optimal *point*, which left-open parallel routes broke by giving the solver more
  # than one equally-good vertex to land on. FVA has no such requirement --- variability is
  # the entire point of the function --- so the parallel routes and the isozyme choice are
  # left in deliberately, to give ecFVA something non-trivial to range over.

# Both sides read the bound of a canonical reaction directly off the solve of its own group
# (GECKO#466): one LP maximises (then minimises) the group's combined forward-minus-reverse flux
# and the combined value is read off that solve, the "diagonal", so it is always a value that one
# feasible flux distribution attains. R1, R3, R4, R5, S1 and S2 (every reaction with no isozyme
# split) agree, and so does R2, the one reaction that has one: both report [-6000, 3272.73].
tolerance:
  rel: 1.0e-6
  abs: 1.0e-6
