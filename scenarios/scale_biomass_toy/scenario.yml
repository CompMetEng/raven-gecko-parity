    op: rescale
    model: neutral
    config: standard
    component: protein
    factor: 2
    new_value: null
    balance_out: null
    target_total: null
    proton_in_protein: false
    formula_overrides: []
    charge_overrides: []
    omit_charges: false
    proton_met: h_c
  - name: rescale_charged
