id: hits_from_supporth_toy
pair: raven
description: >-
  hitsFromSuppOrth on a small suppOrth.tsv with three species, protein ids that are "NA" or have leading zeros, a
  pair without alignment values and a pair listed in both orientations. Cases: the defaults, minimum support 2, a
  required predictor, identity and e-value filters, a species mapped out and a protein-to-gene file, an unknown
  organism, and a required predictor that is not in the table. Per case the gene pairs in both directions with
  the bitscore, and the support information.

entries:
  - hitsFromSuppOrth

inputs:
  table: "{scenario_dir}/data/suppOrth.tsv"
  gene_map: "{scenario_dir}/data/protein_to_gene.tsv"
  cases:
  - {name: defaults, organism: bug, species_to_model: null, min_support: 1, require_tools: [], min_identity: null, max_evalue: null, use_gene_map: false}
  - {name: min_support_two, organism: bug, species_to_model: null, min_support: 2, require_tools: [], min_identity: null, max_evalue: null, use_gene_map: false}
  - {name: require_broccoli, organism: bug, species_to_model: null, min_support: 1, require_tools: [broccoli], min_identity: null, max_evalue: null, use_gene_map: false}
  - {name: identity_filter, organism: bug, species_to_model: null, min_support: 1, require_tools: [], min_identity: 80, max_evalue: null, use_gene_map: false}
  - {name: evalue_filter, organism: bug, species_to_model: null, min_support: 1, require_tools: [], min_identity: null, max_evalue: 1.0e-70, use_gene_map: false}
  - {name: other_left_out_with_gene_map, organism: bug, species_to_model: {bug: bug, templateGEM: templateGEM, other: null}, min_support: 1, require_tools: [], min_identity: null, max_evalue: null, use_gene_map: true}
  - {name: unknown_organism, organism: nothing, species_to_model: null, min_support: 1, require_tools: [], min_identity: null, max_evalue: null, use_gene_map: false}
  - {name: unknown_tool, organism: bug, species_to_model: null, min_support: 1, require_tools: [oma], min_identity: null, max_evalue: null, use_gene_map: false}
