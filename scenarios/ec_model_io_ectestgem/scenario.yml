id: ec_model_io_ectestgem
pair: gecko
description: >-
  saveEcModel / loadEcModel round-trip on a freshly built ecModel: what the writer
  produces, and what survives a write-read round trip.

# The GECKO analogue of raven-toolbox's own yaml_roundtrip_smallyeast. saveEcModel and
# save_ec_model are both thin wrappers around RAVEN's writeYAMLmodel / write_yaml_model (see
# their own docstrings). The `direct` and `roundtrip` checkpoints show that each side reads
# back its own file unchanged. The `written` checkpoint differs in content, not in layout:
# the two files have the same indent, key order and quoting, and identical `ec-rxns`,
# `ec-enzymes` and `gecko_light` blocks. What differs is `metaData` (both files record
# gecko_format and a generator line; only the Python file has a description), `charge: 0.0` on four metabolites
# (cobra's SBML import fills in 0 where the SBML sets none), SBO terms on metabolites,
# reactions and genes (kept by cobra, dropped by the MATLAB import when one term covers a whole
# entity type), `subsystem: Protein usage` on the protein-pool reactions (always set by
# make_ec_model, only set by makeEcModel when the model has subsystems) and the gene `name`
# (read from the SBML gene label by the MATLAB import, empty after cobra's import). The
# `direct` and `roundtrip` summaries do not look at those fields; ec_model_io_crossload_ectestgem
# does. A single `ec-code` is written as a list by both writers.
#
# R5 is made an ec reaction without enzymes (an empty row of the coupling matrix and source
# `standard`, as a standard kcat row) before the write. Both writers give it the same lines
# and no `enzymes` entry, and the round trip returns the row empty.
#
# One difference from yaml_roundtrip_smallyeast worth stating: that scenario's `direct`
# checkpoint is the tutorial fixture *read*, because a real smallYeast.yml already exists.
# ecTestGEM ships no ecModel.yml --- an ecModel only exists once makeEcModel has built one
# --- so `direct` here is the freshly built ecModel, not something read off disk. The
# fixture is still shared: both sides build from the same SBML file and the same adapter
# data, exactly as in ec_model_expansion_ectestgem.
#
# Scoped to the full ecModel only. The writer's job does not depend on how ec.* was
# populated, and the full/light distinction is already covered by
# ec_model_expansion_ectestgem; repeating it here would test the same expansion code
# twice under a different name.

entries:
  - saveEcModel
  - loadEcModel

inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"
  adapter_python: "{python_repo}/examples/ecTestGEM"

# Nothing here is summed: every field is either copied through serialisation or a count.
# A last-bit difference would be a real one, same as the other three gecko scenarios.
tolerance:
  rel: 0.0
  abs: 0.0
