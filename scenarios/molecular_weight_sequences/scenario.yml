id: molecular_weight_sequences
pair: gecko
description: >-
  Molecular weight from an amino-acid sequence, for a fixed list of sequences
  chosen to isolate one variable each rather than to look like real proteins.
  No model, no adapter, no file on either side: calculateMW and calculate_mw
  take a bare string, so the sequences are the fixture.

entries:
  - calculateMW

# Both sides agree exactly on every sequence below. Each sequence isolates one variable, and a
# delta that appears is itself a finding.
inputs:
  sequences:
    # No residues at all: both sides return NaN. Two routes to zero residues (the empty string
    # and a string of digits and a space), so the rule is shown to be general.
    - ""
    - "007 42"

    # One standard residue, isolating the water-mass constant: both sides start from 18.01528.
    - "A"

    # All twenty standard residues once each. If this sequence's delta is ever not exactly
    # zero, the standard mass table has drifted.
    - "ACDEFGHIKLMNPQRSTVWY"

    # X ("any residue"): the unweighted mean of the twenty standard masses on both sides,
    # 118.885. Two occurrences, so the rule holds per residue.
    - "X"
    - "XX"

    # B ("D or N"): the average of the D and N masses on both sides, 114.595.
    - "B"

    # J, O, U, Z: the other four non-standard codes, which have the same mass in both tables.
    - "J"
    - "O"
    - "U"
    - "Z"

    # Case: both sides upper-case the sequence first, so a lowercase letter is a real residue.
    - "AaAa"

    # Digits and a space mixed in among real residues are ignored on both sides.
    - "MRA1 L2"

    # The five sequences ecTestGEM ships in test/unit_tests/ecTestGEM/data/uniprot.tsv. None
    # contains X, B or a lowercase letter.
    - "MRAL"
    - "MNTD"
    - "MSYN"
    - "MDFM"
    - "MLFK"

# Not zero: calculateMW sums many terms, and the last bit of a float can differ by rounding
# even where the formula is identical. Tight enough that no difference between the mass
# tables could hide behind it.
tolerance:
  rel: 1.0e-9
  abs: 1.0e-12
