id: kcat_io_edge_cases_ectestgem
pair: gecko
description: >-
  Edge cases of the text and bookkeeping around kcats: the local SMILES cache of
  findMetSmiles (a duplicated name, a metabolite without a name), the OpenKineticsPredictor
  input for reactions that share enzymes, the kcat source files (a detail with a tab or a
  leading separator, rows a spreadsheet may have quoted) and the standard-kcat fallback (a
  reaction without enzymes that has two substrates, a biomass pseudoreaction, a light model
  called twice). Each case builds its own state. A raise is a value on both sides. No case
  reaches PubChem: every metabolite name is in the vendored cache.

entries:
  - findMetSmiles
  - writeOpenKineticsPredictorInput
  - saveKcatSource
  - loadKcatSource
  - getStandardKcat

# All cases agree on both sides:
#   findMetSmiles takes the last row of a name that is duplicated in smilesDB.tsv and gives no
#     SMILES to a metabolite without a name (with a warning).
#   loadKcatSource skips a row of empty quoted fields and a quoted comment and raises for a field
#     that opens a quote and never closes it.
#   getStandardKcat leaves out a reaction without a GPR and with two substrates (an exchange
#     reaction) and a reaction named 'Biomass Pseudoreaction', and runs twice on a light model.
#   saveKcatSource writes a tab or line break of the detail text as a space, so
# a row is never split, and leaves no leading, trailing or repeated '; ' in the detail column.
# The OpenKineticsPredictor input for all reactions agrees on this fixture.

inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

  # MATLAB resolves smilesDB.tsv, uniprot.tsv and the OKP input through the adapter's own
  # params.path (<root>/data/...), so a copy of the adapter (ModelAdapter is a value class)
  # is redirected to each root; Python takes explicit paths into the same files.
  scenario_root: "{scenario_dir}"
  dup_root: "{scenario_dir}/smiles_dup"
  empty_root: "{scenario_dir}/smiles_empty"
  okp_root: "{scenario_dir}/okp"
  uniprot_path: "{scenario_dir}/data/uniprot.tsv"
  odd_source: "{scenario_dir}/data/odd.tsv"
  odd_quote_source: "{scenario_dir}/data/odd_quote.tsv"
  save_dir: "{repo_root}/results/.kcat_io_save"

tolerance:
  rel: 1.0e-9
  abs: 1.0e-12
