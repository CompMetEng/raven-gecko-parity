id: sensitivity_tuning_edge_cases_ectestgem
pair: gecko
description: >-
  Edge cases of sensitivityTuning and truncateValues on ecTestGEM's single-route ecModel: the order of the
  tuned reactions, tuning a model that was tuned before, how the pre-tune kcat is written to ec.notes, the
  tuned kcat above 1e7, protToIgnore with an unknown or a lower-case id, a model whose growth is
  zero, a gecko-light model, and rounding ties.

entries:
  - sensitivityTuning
  - truncateValues

inputs:
  adapter_matlab: "{matlab_repo}/test/unit_tests/ecTestGEM/TestGEMAdapter.m"
  adapter_python: "{python_repo}/examples/ecTestGEM"
  fixture_dir: "{matlab_repo}/test/unit_tests/ecTestGEM"

  matlab_solver: gurobi
  python_solver: gurobi

  bio_rxn: R5

  # R2 and R4 are blocked in every case, so R3 is the only route from m1 to m2 and the protein pool is
  # 1000 mg/gDCW (Ptot 0.5, f 4, sigma 0.5). The pool cost of one unit of flux is MW / (kcat * 3600):
  # 40000 / (kcat_R3 * 3600) for R3 and 50000 / (kcat_R5 * 3600) for R5.

  # order: both reactions cost about the same. The tuning bumps R5 (277.8 mg per flux against 222.2),
  # then R3, then R5 again, so the first tuned reaction is R5 and the sorted order is R3, R5.
  order_kcats:
    R3: 0.05
    R5: 0.05
  order_desired_growth: 30.0

  # rerun: the model tuned in the order case is tuned again with a higher target. The reaction that is
  # bumped has source sensitivityTuning already, so its old kcat and source in the result are the ones of
  # the first run on MATLAB's side.
  rerun_desired_growth: 200.0

  # notes: the pre-tune kcat is written as text into ec.notes. A kcat of 10 and one with more digits than
  # num2str keeps are tuned once each.
  notes_whole_kcats:
    R3: 10.0
    R5: 200.0
  notes_whole_desired_growth: 1000.0
  notes_long_kcats:
    R3: 3.14159265
    R5: 200.0
  notes_long_desired_growth: 1000.0

  # ceiling: R3 at 2e6 /s is the limiting reaction with a pool of 0.01 mg; a bump by 10 gives 2e7. A tuned
  # kcat has no upper limit on either side. R5 at 1e8 /s costs next to nothing.
  ceiling_kcats:
    R3: 2000000.0
    R5: 100000000.0
  ceiling_pool:
    p_tot: 0.00001
    f: 1.0
    sigma: 1.0
  ceiling_desired_growth: 10000.0

  # ignore: R3 limits growth. An id that matches no usage reaction is an error in sensitivityTuning, a
  # lower-case id matches case-insensitively there.
  ignore_kcats:
    R3: 0.05
    R5: 200.0
  ignore_desired_growth: 50.0
  ignore_unknown_id: NOPE
  ignore_lower_case_id: p4

  # zero growth: R5 is blocked, so growth is 0 at the start and nothing carries flux. The case where a
  # forced flux keeps a usage reaction active at zero growth needs a reaction that ecTestGEM does not have.
  zero_growth_desired_growth: 30.0

  # light: the same model as a gecko-light ecModel.
  light_kcats:
    R3: 0.05
    R5: 200.0
  light_desired_growth: 30.0

  # truncate: exact ties in the decimal rounding of truncateValues, a value that needs no rounding, zero,
  # and the non-finite values.
  truncate_inputs: ["100000.5", "1234565", "-1234565", "0.5", "0", "Inf", "NaN"]

# Results (seeds 0, 1 and 2 agree):
#
# order, rerun, notes_*, ceiling, ignore_unknown_id, light: both sides agree. Both list the tuned reactions in model order
#   (`kcatList = unique(kcatList)`), report the kcat and source of the input model (a reaction tuned before reports the
#   values of that run), write the pre-tune kcat into ec.notes as num2str prints it (preTuneKcat=10, preTuneKcat=3.1416),
#   let a tuned kcat pass 1e7, raise for a protToIgnore id that has no usage reaction, and tune a gecko-light model.
# ignore_lower_case_id: both sides match p4 without regard to case and skip P4 when they pick the enzyme to tune, and both
#   raise the kcat of R5 by a factor of 10 per iteration. They differ in when they stop: geckopy stops once growth gains
#   less than 1e-9 (growth 4.5, R5 at 2e10), sensitivityTuning goes on until growth is exactly unchanged (growth 450, R3 at
#   5 and R5 at 2e13).
# truncate_ties: round(x, n) rounds an exact tie away from zero in MATLAB (100000.5 gives 100001, 1234565 gives 1234570) and
#   to even in Python (100000, 1234560). Inf raises in MATLAB and is returned unchanged by geckopy.
# zero_growth: with growth 0 and no flux both sides return an empty result. The case of a forced flux that keeps a usage
#   reaction active at zero growth needs a reaction that ecTestGEM does not have, and is not covered.

tolerance:
  rel: 1.0e-9
  abs: 1.0e-12
