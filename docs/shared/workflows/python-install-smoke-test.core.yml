name: Install smoke test

# Does the shipped package work? This builds the wheel and installs *that*, not an
# editable checkout, into a clean environment, on every OS the test matrix covers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: wheel install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --upgrade pip build

      - name: Build the wheel
        run: python -m build --wheel

      - name: Install the built wheel into a clean environment
        shell: bash
        run: pip install dist/*.whl

      - name: Import the package
        run: python -c "import {{PACKAGE}}; print({{PACKAGE}}.__name__)"
