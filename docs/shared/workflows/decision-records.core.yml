name: Decision records

# Checks the records in decisions/ (see .github/scripts/decision_records.py). Without a
# decisions/ folder every step succeeds without output.

on:
  push:
    branches: [{{OWN_REF}}]
  pull_request:

permissions:
  contents: read

jobs:
  records:
    name: records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Records in the working tree
        run: python3 -I .github/scripts/decision_records.py check

      # On a pull request the checkout is the merge result, so its first parent is the
      # current tip of the base branch.
      - name: Changes of the pull request
        if: github.event_name == 'pull_request'
        run: python3 -I .github/scripts/decision_records.py diff --base HEAD^1 --head HEAD

      - name: Changes of the push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 -I .github/scripts/decision_records.py diff --base "$BEFORE" --head "$GITHUB_SHA"
