name: Documentation

# Regenerate doc/ from the function help texts and commit the result.
#
# doc/ is generated output that is nevertheless tracked, so it drifts as soon as anyone
# edits a docstring or adds/removes a function without remembering to regenerate it by hand.
# Running it here instead means nobody has to.
#
# This deliberately does not gate pull requests: a docstring edit would then fail CI until
# the contributor installed MATLAB and regenerated by hand. The push job is the single
# writer, and it runs after the merge.
#
# Commits made with GITHUB_TOKEN do not trigger workflows, so this cannot loop. The commit
# message still carries [skip ci] regardless, since a doc-only commit would otherwise
# needlessly re-trigger this repo's other push-based workflows, which key off the push event
# itself rather than the path filter this workflow uses.
#
# main is deliberately not in the branch list. doc/ is already current there the moment a
# release PR merges (it was kept current on {{OWN_REF}} the whole time this workflow watches
# it, and the merge carries that straight across), triggering a second, independent
# regeneration on main would only be redundant, and if the underlying tool isn't
# byte-identical across runs (a generation timestamp embedded in every page, say), that
# redundant run rewrites doc/ wholesale right next to the release, which can look exactly
# like files were deleted and re-added rather than a clean, minimal diff.

on:
  push:
    branches: [{{OWN_REF}}, develop]
    paths:
      - '**.m'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One writer per branch; a newer push supersedes an in-flight regeneration.
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-documentation:
    name: Regenerate doc/
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

{{EXTRA_CHECKOUT}}
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Regenerate HTML documentation
        uses: matlab-actions/run-command@v3
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
        with:
          command: |
{{DOC_COMMAND}}

      - name: Commit regenerated documentation
        run: |
          # The command above deletes and rebuilds doc/, so stage first: a plain
          # "git diff" would not see added or removed pages.
          git add -A doc
          if git diff --cached --quiet -- doc; then
            echo "doc/ is already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "doc: regenerate HTML documentation for ${GITHUB_SHA:0:7} [skip ci]"
          git push
